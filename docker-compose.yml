# docker-compose.yml
# Production deployment for Vijaya Durga Refrigeration
# Guarantees persistent SQLite database storage across container restarts and updates

version: '3.8'

services:
  vdr-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vdr-showroom-production
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=file:/app/data/vdr.db
      - ADMIN_SESSION_SECRET=${ADMIN_SESSION_SECRET:-super-secure-production-secret-replace-me}
      - ADMIN_INITIAL_EMAIL=${ADMIN_INITIAL_EMAIL:-admin@vijayadurgarefrigeration.com}
      - ADMIN_INITIAL_PASSWORD=${ADMIN_INITIAL_PASSWORD:-VdrAdmin@2026!}
      - STORAGE_PROVIDER=${STORAGE_PROVIDER:-local}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME:-}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY:-}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET:-}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-https://vijayadurgarefrigeration.com}
    volumes:
      # Persistent volume for SQLite database & point-in-time snapshots
      - vdr-db-data:/app/data
      # Persistent volume for local uploaded images
      - vdr-uploads-data:/app/public/uploads
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/robots.txt"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  vdr-db-data:
    name: vdr_production_db
  vdr-uploads-data:
    name: vdr_production_uploads
